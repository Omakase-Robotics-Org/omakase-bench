id: core/press_button
version: 1.0.0
title: Press the wall button
interfaces: [tools, code, chunks, scripted]
instruction: Press the {button_color} button on the wall in front of you.
scene:
  robot: {preset: d1, base: [0, 0, 0], lift: 0.10, neck: {pan: 0.0, tilt: 0.25}}
  fixtures:
    - {name: wall, type: box, size: [0.06, 1.6, 2.2], pos: [0.73, 0.0, 1.1], color: wall, label: wall}
  articulated:
    - name: button
      type: button
      pos: [0.70, 0.10, 1.05]
      yaw_deg: 180
      color: green
      params: {radius: 0.022, travel: 0.008, protrusion: 0.012, stiffness: 300, press_threshold: 0.6}
  cameras:
    showcase: {pos: [-0.25, -1.25, 1.55], lookat: [0.55, 0.0, 1.0], fovy: 50}
    side: {pos: [0.45, 1.3, 1.2], lookat: [0.55, 0.0, 1.05], fovy: 50}
variation:
  robot.base: {uniform_box: [[-0.06, -0.05, -0.17], [0.02, 0.05, 0.17]]}
  button.y: {uniform: [-0.25, 0.25]}
  button.z: {uniform: [0.95, 1.15]}
  button.color: {choice: [green, red, blue, yellow]}
success: {pressed: button}
subgoals:
  - {name: touched, pred: {touched: [button, any_hand]}, weight: 0.4}
  - {name: pressed, pred: {pressed: button}, weight: 0.6}
budget: {sim_seconds: 60, wall_seconds: 600, api_calls: 30, model_calls: 30, usd: 1.0}
